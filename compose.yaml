version: "3.8"

services:
  app:
    build:
      context: .
    ports:
      - "8080:80"
    environment:
      - NODE_ENV=development
      - REDIS_HOST=redis
      - DB_HOST=postgres
      - DB_USER=postgres
      - DB_PASSWORD=secret
    depends_on:
      - redis
      - postgres
    networks:
      - app-network

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    networks:
      - app-network

  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=secret
      - POSTGRES_DB=myapp
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data: