services:
  app:
    build:
      context: .
    ports:
      - "8082:80"  # <-- Change 8080 to 8082 (or another free port like 8085)

  postgres:
    image: postgres
    environment:
      POSTGRES_DB: mydatabase
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"  # Keep 5433 here to avoid the postgres port conflict

  redis:
    image: redis:alpine