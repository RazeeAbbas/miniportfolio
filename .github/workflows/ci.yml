name: Portfolio CI

on:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: List Files
        run: ls -la

      - name: Check HTML
        run: test -f index.html

      - name: Check CSS
        run: test -f style.css